{% extends "blog/base.html" %}

{% block title %}
    Login - Django Blog
{% endblock %}

{% block content %}

<h2>Login</h2>

{% if form.errors %}
    <div class="error-message">
        <p>
            Your username or password is incorrect.
            Please try again.
        </p>
    </div>
{% endif %}

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Login
    </button>
</form>


<p>
    Don't have an account?
    <a href="{% url 'register' %}">
        Register
    </a>
</p>

{% endblock %}
