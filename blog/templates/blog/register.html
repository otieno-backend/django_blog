{% extends "blog/base.html" %}

{% block title %}
    Register - Django Blog
{% endblock %}

{% block content %}

<h2>Register</h2>

{% if form.errors %}
    <div class="error-message">
        <p>Please correct the errors below.</p>
    </div>
{% endif %}

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Register
    </button>

</form>

<p>
    Already have an account?
    <a href="{% url 'login' %}">
        Login
    </a>
</p>

{% endblock %}
