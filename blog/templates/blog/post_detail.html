{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ post.title }}</title>

    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>

<body>

    <!-- Header -->
    <header>
        <nav>
            <ul>
                <li>
                    <a href="{% url 'post_list' %}">Home</a>
                </li>
                <li>
                    <a href="#">About</a>
                </li>
                <li>
                    <a href="#">Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Blog Post -->
    <main class="content">

        <h1>{{ post.title }}</h1>

        <article>

            <h2>{{ post.title }}</h2>

            <p>
                {{ post.content }}
            </p>

            <p>
                Published on: {{ post.created_at }}
            </p>

            <a href="{% url 'post_list' %}">
                Back to Posts
            </a>

        </article>

    </main>

    <!-- Footer -->
    <footer>
        My Blog
    </footer>

    <!-- JavaScript -->
    <script src="{% static 'blog/script.js' %}"></script>

</body>
</html>
