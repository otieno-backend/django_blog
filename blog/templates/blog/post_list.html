{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>

<body>

    <!-- Header -->
    <header>
        <nav>
            <ul>
                <li>
                    <a href="{% url 'post_list' %}">Home</a>
                </li>
                <li>
                    <a href="#">About</a>
                </li>
                <li>
                    <a href="#">Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="content">

        <h1>My Blog</h1>

        {% for post in posts %}

        <article>
            <h2>{{ post.title }}</h2>

            <p>
                {{ post.content|truncatewords:30 }}
            </p>

            <a href="{% url 'post_detail' post.id %}">
                Read More
            </a>
        </article>

        {% empty %}

        <article>
            <h2>No Posts Yet</h2>

            <p>
                There are no blog posts available.
            </p>
        </article>

        {% endfor %}

    </main>

    <!-- Footer -->
    <footer>
        My Blog
    </footer>

    <!-- JavaScript -->
    <script src="{% static 'blog/script.js' %}"></script>

</body>
</html>
